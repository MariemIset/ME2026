# =========================================================================
# Composes the ML service alongside the existing data-warehouse network.
# Run from the ME2026/churn_ml directory:
#     docker compose -f docker-compose.ml.yml up --build
# The service joins the "ME2026_default" network so it can reach the
# postgres_dw container directly on hostname `postgres_dw`.
# =========================================================================

services:
  churn_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres_dw
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
    networks:
      - dw_network

  churn_mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: churn_mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/artifacts
      - mlflow_db:/mlflow
    networks:
      - dw_network

networks:
  dw_network:
    external: true
    name: docker_default

volumes:
  mlflow_db:
