services:
  ml_api:
    image: python:3.11-slim
    container_name: ml_fastapi
    working_dir: /app
    ports:
      - "8001:8000"
    volumes:
      - ../:/app
    command: >
      bash -c "pip install -r machine_learning/requirements.txt fastapi uvicorn pydantic &&
               python -m uvicorn machine_learning.api.main:app --host 0.0.0.0 --port 8000 --reload"
